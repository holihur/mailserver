# GoReleaser 配置：在 CI 中构建并发布版本（本地无需操作）。
# 前端会先构建并嵌入 backend/web，因此 backend 产物是「含网页的单二进制」。
version: 2

project_name: mailserver

before:
  hooks:
    - sh -c "cd frontend && pnpm install --frozen-lockfile && pnpm run build"
    - sh -c "rm -rf backend/web && mkdir -p backend/web && touch backend/web/.keep && cp -r frontend/dist/. backend/web/"

builds:
  # 单二进制：API + SMTP/POP3/IMAP + 内置权威 DNS + 内嵌前端（纯 Go）
  - id: mailserver
    dir: backend
    main: .
    binary: mailserver
    flags:
      - -trimpath
    ldflags:
      - -s -w
      - -X main.version={{.Version}}
      - -X main.commit={{.Commit}}
      - -X main.date={{.Date}}
    env:
      - CGO_ENABLED=0
    goos: [linux]
    goarch: [amd64, arm64]

archives:
  - id: mailserver
    ids: [mailserver]
    formats: [tar.gz]
    name_template: "mailserver_{{ .Tag }}_linux_{{ .Arch }}"

checksum:
  name_template: checksums.txt

# 供应链：为产物生成 SBOM；用 cosign keyless(GitHub OIDC) 签名校验和文件。
sboms:
  - artifacts: archive

signs:
  - cmd: cosign
    signature: "${artifact}.sig"
    certificate: "${artifact}.pem"
    args:
      - sign-blob
      - "--output-signature=${signature}"
      - "--output-certificate=${certificate}"
      - "${artifact}"
      - "--yes"
    artifacts: checksum
    output: true

changelog:
  disable: true

release:
  draft: false
  prerelease: auto
  make_latest: true
  # 允许同一 tag 重跑（失败重发时删除并重建 Release）
  mode: replace
