name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# 同一分支多次推送时取消进行中的旧任务
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend (Go)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: mailserver
          POSTGRES_PASSWORD: mailserver
          POSTGRES_DB: mailserver_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mailserver"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v7
        with:
          go-version: "1.27"
          cache-dependency-path: backend/go.sum

      - name: Download modules
        run: go mod download

      - name: Vet
        run: go vet ./...

      - name: Lint (only new issues)
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.14.0
          working-directory: backend
          only-new-issues: true

      - name: Build
        env:
          CGO_ENABLED: "0"
        run: go build ./...

      - name: govulncheck (dependency CVE gate)
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.8.0 ./...

      - name: Unit tests + coverage gate (core packages >= 90%)
        env:
          CGO_ENABLED: "0"
          TEST_DATABASE_URL: postgres://mailserver:mailserver@localhost:5432/mailserver_test?sslmode=disable
          TEST_REDIS_URL: redis://127.0.0.1:6379/0
        run: |
          python3 - <<'PY'
          import subprocess, sys
          core = {
              'mailserver/internal/auth', 'mailserver/internal/config',
              'mailserver/internal/certstore', 'mailserver/internal/dkim',
              'mailserver/internal/provider', 'mailserver/internal/runtimecfg',
              'mailserver/internal/secret',
          }
          r = subprocess.run(['go', 'test', '-p', '1', '-cover', './...'], capture_output=True, text=True)
          sys.stdout.write(r.stdout)
          sys.stderr.write(r.stderr)
          if r.returncode != 0:
              print('FAIL: go test 失败')
              sys.exit(1)
          bad = []
          for line in r.stdout.splitlines():
              if 'coverage:' not in line or not line.strip().startswith(('ok', 'FAIL')):
                  continue
              parts = line.split()
              pkg = parts[1]
              pct = float(line.split('coverage:')[1].split('%')[0])
              if pkg in core and pct < 90:
                  bad.append(f'{pkg} {pct}%')
          if bad:
              print('FAIL: 核心包覆盖率 <90%:', bad)
              sys.exit(1)
          print('OK: 核心包覆盖率均 >=90%')
          PY

  frontend:
    name: Frontend (pnpm)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.25.0

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install deps
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm run lint

      - name: Unit tests + coverage gate
        run: pnpm run test:coverage

      - name: Build
        run: pnpm run build

      - name: Upload dist
        uses: actions/upload-artifact@v7
        with:
          name: web-dist
          path: frontend/dist
          retention-days: 7

  sanity:
    name: Shell & Docker build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: shellcheck install.sh
        run: shellcheck install.sh

      - name: Docker build (no push)
        run: docker build -f backend/Dockerfile -t mailserver:ci .
