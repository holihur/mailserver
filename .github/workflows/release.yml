name: Release

on:
  push:
    tags:
      - "v*"

# 发布需要写 Release 与推送镜像
permissions:
  contents: write
  packages: write

env:
  PNPM_VERSION: "11.25.0"
  NODE_VERSION: "22"
  GO_VERSION: "1.22"

jobs:
  # ---------------------------------------------------------------------------
  # 1) GoReleaser：构建「含前端」的后端单二进制 + DNS 二进制，创建 GitHub Release
  # ---------------------------------------------------------------------------
  goreleaser:
    name: GoReleaser
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: |
            backend/go.sum
            dns/go.sum

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ---------------------------------------------------------------------------
  # 2) 构建并推送多架构 Docker 镜像到 GHCR
  #    api 镜像已内嵌前端；dns 为权威 DNS
  # ---------------------------------------------------------------------------
  docker:
    name: Publish Docker images
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push api (含前端)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./backend/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/${{ github.repository }}-api:${{ github.ref_name }}
            ghcr.io/${{ github.repository }}-api:latest

      - name: Build & push dns
        uses: docker/build-push-action@v6
        with:
          context: ./dns
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/${{ github.repository }}-dns:${{ github.ref_name }}
            ghcr.io/${{ github.repository }}-dns:latest
