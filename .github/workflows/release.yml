name: Release

on:
  push:
    tags:
      - "v*"

# 发布需要写 Release 与推送镜像；id-token 用于 cosign keyless 签名
permissions:
  contents: write
  packages: write
  id-token: write

env:
  PNPM_VERSION: "11.25.0"
  NODE_VERSION: "22"
  GO_VERSION: "1.27"

jobs:
  # ---------------------------------------------------------------------------
  # 1) GoReleaser：构建「含前端 + 内置 DNS」的单个二进制，创建 GitHub Release
  # ---------------------------------------------------------------------------
  goreleaser:
    name: GoReleaser
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: backend/go.sum

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install cosign
        uses: sigstore/cosign-installer@v3

      - name: Install syft
        uses: anchore/sbom-action/download-syft@v0

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          # 固定到已知稳定的 2.18.2（v0.20.0 成功发版所用）；避免上游 2.18.3 回归导致发版失败
          version: "v2.18.2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ---------------------------------------------------------------------------
  # 2) 构建并推送 Docker 镜像到 GHCR（api 已内嵌前端 + 内置 DNS）
  # ---------------------------------------------------------------------------
  docker:
    name: Publish Docker image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build local image for scanning
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./backend/Dockerfile
          platforms: linux/amd64
          load: true
          push: false
          # 强制拉取最新基础镜像，避免命中过期缓存导致 Trivy 误报
          pull: true
          tags: mailserver:scan

      - name: Trivy image scan (block HIGH/CRITICAL)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: mailserver:scan
          format: json
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          output: trivy-results.json

      - name: Report Trivy findings
        if: failure()
        run: |
          python3 - <<'PY'
          import json
          try:
              d = json.load(open('trivy-results.json'))
          except Exception as e:
              print(f'::error title=Trivy::cannot parse results: {e}')
              raise SystemExit(0)
          for r in d.get('Results', []):
              for v in (r.get('Vulnerabilities') or []):
                  print("::error title=Trivy {sev}::{vid} {pkg} {inst} -> {fixed} | {title}".format(
                      sev=v.get('Severity'), vid=v.get('VulnerabilityID'), pkg=v.get('PkgName'),
                      inst=v.get('InstalledVersion'), fixed=v.get('FixedVersion'), title=v.get('Title')))
          PY

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push api
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./backend/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: true
          sbom: true
          tags: |
            ghcr.io/${{ github.repository }}-api:${{ github.ref_name }}
            ghcr.io/${{ github.repository }}-api:latest
