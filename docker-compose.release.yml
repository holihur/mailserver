# 使用 GHCR 预构建镜像的发布版 compose（PostgreSQL）。
# api 镜像已内嵌前端，Web 界面直接由 api 在 80 端口提供，无需单独的 web 容器。
# 由 install.sh 下载使用，或手动：
#   docker compose -f docker-compose.release.yml up -d

# 日志轮转：Docker 内置 json-file 驱动，按大小/数量滚动，避免日志撑满磁盘。
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-mailserver}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mailserver}
      POSTGRES_DB: ${POSTGRES_DB:-mailserver}
    volumes: [pgdata:/var/lib/postgresql/data]
    restart: unless-stopped
    mem_limit: 256m
    logging: *default-logging
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-mailserver}"]
      interval: 10s
      timeout: 3s
      retries: 10

  api:
    image: ghcr.io/holihur/mailserver-api:${MAILSERVER_TAG:-latest}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    ports: ["${HTTP_PORT:-80}:${PORT:-8080}", "2525:2525", "25:2525", "587:587", "110:110", "143:143", "465:465", "993:993", "995:995", "53:5353/udp", "53:5353/tcp"]
    environment:
      # 容器内监听 PORT（默认 8080）；宿主机映射 HTTP_PORT（默认 80）
      PORT: ${PORT:-8080}
      # 内置权威 DNS（容器内 5353，避免非 root 绑定 53）
      DNS_ADDR: ${DNS_ADDR:-:5353}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      # PostgreSQL 连接串
      DATABASE_URL: ${DATABASE_URL:-postgres://mailserver:${POSTGRES_PASSWORD:-mailserver}@db:5432/mailserver?sslmode=disable}
      DATA_DIR: /data
      CERT_DIR: /data/certs
      JWT_SECRET: ${JWT_SECRET:-change-me-32chars-min}
      MAIL_HOST: ${MAIL_HOST:-mail.example.com}
      SMTP_RELAY_HOST: ${SMTP_RELAY_HOST:-}
      SMTP_RELAY_PORT: ${SMTP_RELAY_PORT:-587}
      SMTP_RELAY_USER: ${SMTP_RELAY_USER:-}
      SMTP_RELAY_PASS: ${SMTP_RELAY_PASS:-}
      SMTP_RELAY_FROM: ${SMTP_RELAY_FROM:-}
      ADMIN_EMAILS: ${ADMIN_EMAILS:-}
      DKIM_SELECTOR: ${DKIM_SELECTOR:-dkim}
      # 日志（写入 /data/logs 并按大小滚动）
      LOG_MAX_MB: ${LOG_MAX_MB:-50}
      LOG_MAX_BACKUPS: ${LOG_MAX_BACKUPS:-5}
      LOG_MAX_AGE_DAYS: ${LOG_MAX_AGE_DAYS:-30}
      LOG_COMPRESS: ${LOG_COMPRESS:-1}
      # 单封邮件大小上限（MB）
      MAX_MESSAGE_MB: ${MAX_MESSAGE_MB:-25}
      DMARC_ENFORCE: ${DMARC_ENFORCE:-none}
      SEND_DAILY_LIMIT: ${SEND_DAILY_LIMIT:-500}
      SEND_PER_MINUTE: ${SEND_PER_MINUTE:-20}
      METRICS_TOKEN: ${METRICS_TOKEN:-}
      # 隐式 TLS 端口（证书可在管理后台一键申请/上传）
      SUBMIT_TLS_PORT: ${SUBMIT_TLS_PORT:-465}
      IMAP_TLS_PORT: ${IMAP_TLS_PORT:-993}
      POP3_TLS_PORT: ${POP3_TLS_PORT:-995}
    volumes: [maildata:/data]
    restart: unless-stopped
    mem_limit: 192m
    logging: *default-logging

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    restart: unless-stopped
    mem_limit: 64m
    logging: *default-logging

volumes: { maildata: {}, pgdata: {} }
