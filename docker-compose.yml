# 日志轮转：Docker 内置 json-file 驱动，按大小/数量滚动，避免日志撑满磁盘。
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: mailserver
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mailserver}
      POSTGRES_DB: mailserver
    volumes: [pgdata:/var/lib/postgresql/data]
    restart: unless-stopped
    mem_limit: 256m
    logging: *default-logging
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mailserver -d mailserver"]
      interval: 10s
      timeout: 5s
      retries: 10

  # API + 内嵌前端（单容器，Web 界面在 80 端口）
  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    ports: ["${HTTP_PORT:-80}:${PORT:-8080}", "2525:2525", "25:2525", "587:587", "465:465", "110:110", "143:143", "995:995", "993:993", "53:5353/udp", "53:5353/tcp"]
    environment:
      # 容器内监听 PORT（默认 8080）；宿主机映射 HTTP_PORT（默认 80）
      PORT: ${PORT:-8080}
      # 内置权威 DNS（容器内 5353，避免非 root 绑定 53）
      DNS_ADDR: ${DNS_ADDR:-:5353}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      DATABASE_URL: postgres://mailserver:${POSTGRES_PASSWORD:-mailserver}@db:5432/mailserver?sslmode=disable
      DATA_DIR: /data
      CERT_DIR: /data/certs
      JWT_SECRET: ${JWT_SECRET:-change-me-32chars-min}
      MAIL_HOST: ${MAIL_HOST:-mail.example.com}
      ADMIN_EMAILS: ${ADMIN_EMAILS:-}
      SMTP_PORT: 2525
      SUBMIT_TLS_PORT: 465
      POP3_TLS_PORT: 995
      IMAP_TLS_PORT: 993
      SMTP_RELAY_HOST: ${SMTP_RELAY_HOST:-}
      SMTP_RELAY_PORT: ${SMTP_RELAY_PORT:-587}
      SMTP_RELAY_USER: ${SMTP_RELAY_USER:-}
      SMTP_RELAY_PASS: ${SMTP_RELAY_PASS:-}
      SMTP_RELAY_FROM: ${SMTP_RELAY_FROM:-}
      DKIM_SELECTOR: ${DKIM_SELECTOR:-dkim}
      # 日志（写入 /data/logs 并按大小滚动）
      LOG_MAX_MB: ${LOG_MAX_MB:-50}
      LOG_MAX_BACKUPS: ${LOG_MAX_BACKUPS:-5}
      LOG_MAX_AGE_DAYS: ${LOG_MAX_AGE_DAYS:-30}
      LOG_COMPRESS: ${LOG_COMPRESS:-1}
      # 单封邮件大小上限（MB）
      MAX_MESSAGE_MB: ${MAX_MESSAGE_MB:-25}
      DMARC_ENFORCE: ${DMARC_ENFORCE:-none}
      SEND_DAILY_LIMIT: ${SEND_DAILY_LIMIT:-500}
      SEND_PER_MINUTE: ${SEND_PER_MINUTE:-20}
      METRICS_TOKEN: ${METRICS_TOKEN:-}
      MTA_STS_MODE: ${MTA_STS_MODE:-none}
      DNSSEC_ENABLE: ${DNSSEC_ENABLE:-0}
      DNSSEC_NSEC3: ${DNSSEC_NSEC3:-0}
      BACKUP_DIR: ${BACKUP_DIR:-}
      BACKUP_INTERVAL_HOURS: ${BACKUP_INTERVAL_HOURS:-24}
      BACKUP_KEEP: ${BACKUP_KEEP:-7}
      BACKUP_HOOK: ${BACKUP_HOOK:-}
    volumes: [maildata:/data]
    restart: unless-stopped
    mem_limit: 192m
    logging: *default-logging

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    restart: unless-stopped
    mem_limit: 64m
    logging: *default-logging

volumes: { maildata: {}, pgdata: {} }
